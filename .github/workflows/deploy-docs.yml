name: Deploy Docs
on:
  push:
    branches:
      - "*.x"
      - "main"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'spring-projects/spring-session'
    steps:
      - name: Dispatch (partial build)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run deploy-docs.yml -r docs-build -f build-refname="$REF_NAME"
