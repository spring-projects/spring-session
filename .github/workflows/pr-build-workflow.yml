name: PR Build

on: pull_request

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ github.repository == 'spring-projects/spring-security-commercial' && github.actor != 'dependabot[bot]' }}
    uses: spring-projects/spring-security-commercial/.github/workflows/build-pull-request.yml@workflows/v1
    secrets: inherit
