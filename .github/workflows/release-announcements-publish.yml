name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-release-announcements:
    name: Publish Release Announcements
    permissions:
      actions: write
      contents: read
      issues: write
    uses: spring-io/spring-security-actions/.github/workflows/release-announcements-publish.yml@ffcef17d3ba156b33fe73535fbd79594ed02b0f8 # 0.0.35
    with:
      version: ${{ inputs.version }}
    secrets:
      SPRING_RELEASE_GCHAT_WEBHOOK_URL: ${{ secrets.SPRING_RELEASE_GCHAT_WEBHOOK_URL }}
