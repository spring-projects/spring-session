name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-release-announcements:
    name: Publish Release Announcements
    permissions:
      actions: write
      contents: read
      issues: write
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-publish.yml@07569de2cd704c6870976fe8f16f7b3cb550d08f # v1.1.2
    with:
      version: ${{ inputs.version }}
    secrets:
      SPRING_RELEASE_GCHAT_WEBHOOK_URL: ${{ secrets.SPRING_RELEASE_GCHAT_WEBHOOK_URL }}
