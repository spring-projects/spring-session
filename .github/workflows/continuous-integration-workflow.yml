name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
  schedule:
    - cron: '0 10 * * *' # Once per day at 10am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: spring-io/spring-security-release-tools/.github/workflows/build.yml@33d8b6e0a246353d4b659d7676173436a302ab2b # v1.0.18
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        jdk: [ 17 ]
    with:
      runs-on: ${{ matrix.os }}
      java-version: ${{ matrix.jdk }}
      distribution: temurin
    secrets: inherit
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.project-version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - id: project-version
        name: Extract Project Version
        uses: spring-io/spring-release-actions/compute-version@6795980b9d960a13d420e114d50f1c8abe730769 # 0.0.7
  deploy-artifacts:
    name: Deploy Artifacts
    needs: [ build, compute-version ]
    if: needs.compute-version.outputs.snapshot == 'true'
    uses: spring-io/spring-security-release-tools/.github/workflows/deploy-artifacts.yml@33d8b6e0a246353d4b659d7676173436a302ab2b # v1.0.18
    with:
      should-deploy-artifacts: ${{ needs.build.outputs.should-deploy-artifacts }}
      default-publish-milestones-central: true
    secrets: inherit
