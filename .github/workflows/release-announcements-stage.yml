name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@a8faab91092251472098d8c20c03a40d719795ed # v1.1.5
    with:
      version: ${{ inputs.version || github.ref_name }}
