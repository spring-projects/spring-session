workflow:
  generator:
    project:
      java:
        versions:
          primary: 17
    workflows:
      release-tools:
        uses: spring-io/spring-security-actions@3d12f90253904da59a24c22b96c2cd0d6cec739a # 0.0.37
        verify: false
      release-train:
        build:
          env:
            ORG_GRADLE_PROJECT_artifactoryUsername: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            ORG_GRADLE_PROJECT_artifactoryPassword: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
        test:
          env:
            ORG_GRADLE_PROJECT_artifactoryUsername: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            ORG_GRADLE_PROJECT_artifactoryPassword: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
          runs-on: 'ubuntu22-8-32'
