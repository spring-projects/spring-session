workflow:
  generator:
    project:
      java:
        versions:
          primary: 17
    workflows:
      release-tools:
        uses: spring-io/spring-security-actions@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
      release-train:
        build:
          env:
            ORG_GRADLE_PROJECT_artifactoryUsername: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            ORG_GRADLE_PROJECT_artifactoryPassword: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
        test:
          env:
            ORG_GRADLE_PROJECT_artifactoryUsername: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            ORG_GRADLE_PROJECT_artifactoryPassword: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
          runs-on: 'ubuntu22-8-32'
